name: Native parser bounds

on: [push, pull_request]

permissions:
  contents: read

jobs:
  native-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build regression tests
        run: cmake --build build --config Release --target binary_reader_test page_view_test lob_chain_test --parallel 2
      - name: Run synthetic regression tests
        run: ctest --test-dir build/core -C Release --output-on-failure -R "^(binary_reader|page_view|lob_chain)_test$"

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan and UBSan
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build regression tests
        run: cmake --build build --target binary_reader_test page_view_test lob_chain_test --parallel 2
      - name: Run synthetic regression tests
        run: ctest --test-dir build/core --output-on-failure -R "^(binary_reader|page_view|lob_chain)_test$"
